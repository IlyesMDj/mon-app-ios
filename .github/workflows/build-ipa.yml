name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler l'app (sans signature)
        run: |
          xcodebuild \
            -project MonApp.xcodeproj \
            -target MonApp \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Emballer le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/MonApp.app Payload/
          zip -qry MonApp.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: MonApp-ipa
          path: MonApp.ipa
